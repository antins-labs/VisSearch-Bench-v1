[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vissearch-bench"
version = "0.1.0"
description = "Direct and ReAct baselines with task-specific evaluation for VisSearch-Bench"
requires-python = ">=3.10"
dependencies = [
  "openai>=2.8.1,<3",
  "anthropic>=0.72.1,<1",
  "Pillow>=11.3,<13",
  "requests>=2.32.5,<3",
  "httpx[socks]>=0.28.1,<1",
  "datasets>=3,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
vissearch-infer = "vissearch_bench.inference:main"
vissearch-evaluate = "vissearch_bench.evaluate:main"

[tool.setuptools.packages.find]
include = ["vissearch_bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
